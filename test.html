<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Offis MarketPlay - Panel de Vendedores</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ff6600;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    .profile-preview {
      text-align: center;
      margin-bottom: 1rem;
    }
    .profile-preview img {
      width: 100px;
      border-radius: 50%;
    }
    .info {
      text-align: left;
      margin-top: 1rem;
    }
    .info p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Panel de Vendedores</h1>
    <p>Anime Offis MarketPlay</p>
  </header>

  <div class="container" id="auth-section">
    <h2>Acceso</h2>
    <input type="email" id="email" placeholder="Correo" />
    <input type="password" id="password" placeholder="Contraseña" />
    <input type="text" id="displayName" placeholder="Nombre de tienda (solo al registrarse)" />
    <input type="text" id="photoURL" placeholder="URL de imagen de perfil (opcional)" />
    <button id="login-btn">Iniciar sesión</button>
    <button id="register-btn">Crear cuenta</button>
  </div>

  <div class="container" id="panel-section" style="display:none;">
    <h2>Subir producto</h2>
    <div class="profile-preview">
      <img id="profile-img" src="https://via.placeholder.com/100" alt="Perfil" />
      <p id="vendor-name">Tienda: —</p>
    </div>
    <input type="text" id="nombre" placeholder="Nombre del producto" />
    <textarea id="descripcion" placeholder="Descripción del producto"></textarea>
    <input type="number" id="precio" placeholder="Precio en MXN" />
    <input type="text" id="imagen" placeholder="URL de imagen del producto" />
    <button id="publicar-btn">Publicar producto</button>
  </div>

  <div class="container" id="perfil-section" style="display:none;">
    <h2>Perfil de Empresa</h2>
    <div class="profile-preview">
      <img id="empresa-img" src="https://via.placeholder.com/120" alt="Logo empresa" />
      <h3 id="empresa-nombre">Nombre Comercial</h3>
    </div>
    <div class="info">
      <p><strong>RFC:</strong> <span id="empresa-rfc">—</span></p>
      <p><strong>Dirección:</strong> <span id="empresa-direccion">—</span></p>
      <p><strong>Total de productos publicados:</strong> <span id="empresa-ventas">0</span></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC21V6Mkjy8l-XgplQiD6c0PAaOMTaGVu4",
      authDomain: "shop-87529.firebaseapp.com",
      projectId: "shop-87529",
      storageBucket: "shop-87529.appspot.com",
      messagingSenderId: "287195033559",
      appId: "1:287195033559:web:dbc72aa0932d32b9206592",
      measurementId: "G-DBQD3DLD54"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("login-btn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, password)
        .then(() => alert("Sesión iniciada"))
        .catch(err => alert("Error: " + err.message));
    });

    document.getElementById("register-btn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const displayName = document.getElementById("displayName").value;
      const photoURL = document.getElementById("photoURL").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(userCredential => {
          return updateProfile(userCredential.user, {
            displayName,
            photoURL
          });
        })
        .then(() => alert("Cuenta creada"))
        .catch(err => alert("Error: " + err.message));
    });

    onAuthStateChanged(auth, async user => {
      if (!user) return;

      document.getElementById("auth-section").style.display = "none";
      document.getElementById("panel-section").style.display = "block";
      document.getElementById("perfil-section").style.display = "block";

      document.getElementById("vendor-name").textContent = "Tienda: " + (user.displayName || user.email);
      document.getElementById("profile-img").src = user.photoURL || "https://via.placeholder.com/100";
      document.getElementById("empresa-nombre").textContent = user.displayName || "Sin nombre";
      document.getElementById("empresa-img").src = user.photoURL || "https://via.placeholder.com/120";

      const perfilRef = doc(db, "empresas", user.uid);
      const perfilSnap = await getDoc(perfilRef);
      if (perfilSnap.exists()) {
        const data = perfilSnap.data();
        document.getElementById("empresa-rfc").textContent = data.rfc || "—";
        document.getElementById("empresa-direccion").textContent = data.direccion || "—";
      }

      const productosRef = collection(db, "productos");
      const q = query(productosRef, where("vendedor", "==", user.email));
      const productosSnap = await getDocs(q);
      document.getElementById("empresa-ventas").textContent = productosSnap.size;
    });

    document.getElementById("publicar-btn").addEventListener("click", async () => {
      const nombre = document.getElementById("nombre").value;
      const descripcion = document.getElementById("descripcion").value;
      const precio = document.getElementById("precio").value;
      const imagen = document.getElementById("imagen").value;

      const vendedor = auth.currentUser;
      if (!vendedor) return alert("Debes iniciar sesión");

      await addDoc(collection(db, "productos"), {
        nombre,
        descripcion,
        precio: Number(precio),
        imagen,
        vendedor: vendedor.email,
        tienda: vendedor.displayName || "Sin nombre",
        perfil: vendedor.photoURL || "",
        fecha: new Date().toISOString()
      });

      alert("Producto publicado");
    });
  </script>
</body>
</html>
