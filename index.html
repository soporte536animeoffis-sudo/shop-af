<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Offis MarketPlay</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ff6600;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .search-bar {
      text-align: center;
      margin: 1rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 60%;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .item {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 1rem;
      text-align: center;
    }
    .item img {
      max-width: 100%;
      border-radius: 5px;
    }
    .item h3 {
      margin: 0.5rem 0;
    }
    .item p {
      color: #555;
    }
    .price {
      color: #ff6600;
      font-weight: bold;
    }
    .buy-btn {
      background: #ff6600;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Anime Offis MarketPlay</h1>
    <p>Compra productos únicos con estilo anime mexicano</p>
  </header>

  <div class="search-bar">
    <input type="text" placeholder="Buscar productos..." />
  </div>

  <div class="grid">
    <div class="item">
      <img src="https://via.placeholder.com/200x200?text=Camisa+Styceht" alt="Camisa Styceht" />
      <h3>Camisa Styceht</h3>
      <p class="price">$249 MXN</p>
      <button class="buy-btn">Comprar</button>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/200x200?text=Traje+Anime+Offis" alt="Traje Anime Offis" />
      <h3>Traje Anime Offis</h3>
      <p class="price">$899 MXN</p>
      <button class="buy-btn">Comprar</button>
    </div>
    <!-- Puedes duplicar este bloque para más productos -->
  </div>
</body>
</html>
