<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Offis MarketPlay</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ff6600;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .search-bar {
      text-align: center;
      margin: 1rem;
    }
    input[type="text"] {
      padding: 0.5rem;
      width: 60%;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .item {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 1rem;
      text-align: center;
      transition: transform 0.2s;
    }
    .item:hover {
      transform: scale(1.02);
    }
    .item img {
      max-width: 100%;
      border-radius: 5px;
    }
    .item h3 {
      margin: 0.5rem 0;
    }
    .item p {
      color: #555;
    }
    .price {
      color: #ff6600;
      font-weight: bold;
    }
    .buy-btn {
      background: #ff6600;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 0.5rem;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Anime Offis MarketPlay</h1>
    <p>Compra productos únicos con estilo anime mexicano</p>
  </header>

  <div class="search-bar">
    <input type="text" id="busqueda" placeholder="Buscar productos..." />
  </div>

  <div class="grid" id="grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC21V6Mkjy8l-XgplQiD6c0PAaOMTaGVu4",
      authDomain: "shop-87529.firebaseapp.com",
      databaseURL: "https://shop-87529-default-rtdb.firebaseio.com",
      projectId: "shop-87529"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const grid = document.getElementById("grid");
    const busqueda = document.getElementById("busqueda");

    let todosLosProductos = [];

    async function cargarProductos() {
      const snapshot = await get(ref(db, "productos"));
      if (!snapshot.exists()) {
        grid.innerHTML = "<p style='text-align:center;'>No hay productos disponibles por el momento.</p>";
        return;
      }

      const vendedores = snapshot.val();
      todosLosProductos = [];

      for (const uid in vendedores) {
        const productos = vendedores[uid];
        for (const id in productos) {
          const data = productos[id];
          todosLosProductos.push({ ...data, id, uid });
        }
      }

      mostrarProductos(todosLosProductos);
    }

    function mostrarProductos(lista) {
      grid.innerHTML = "";
      lista.forEach(prod => {
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}" />
          <h3>${prod.nombre}</h3>
          <p>${prod.descripcion}</p>
          <p class="price">$${prod.precio} MXN</p>
          <a class="buy-btn" href="producto.html?id=${prod.id}&uid=${prod.uid}">Ver más</a>
        `;
        grid.appendChild(item);
      });
    }

    busqueda.addEventListener("input", () => {
      const texto = busqueda.value.toLowerCase();
      const filtrados = todosLosProductos.filter(p =>
        p.nombre.toLowerCase().includes(texto) ||
        p.descripcion.toLowerCase().includes(texto)
      );
      mostrarProductos(filtrados);
    });

    cargarProductos();
  </script>
</body>
</html>
