<!-- perfil.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil de Empresa</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; padding: 0; }
    header { background: #ff6600; color: white; padding: 1rem; text-align: center; }
    .container { max-width: 500px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    img { width: 120px; border-radius: 50%; margin-bottom: 1rem; }
    .info { text-align: left; margin-top: 1rem; }
    .info p { margin: 0.5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Perfil de Empresa</h1>
  </header>

  <div class="container">
    <img id="empresa-img" src="https://via.placeholder.com/120" alt="Logo empresa" />
    <h2 id="empresa-nombre">Nombre Comercial</h2>
    <div class="info">
      <p><strong>RFC:</strong> <span id="empresa-rfc">—</span></p>
      <p><strong>Dirección:</strong> <span id="empresa-direccion">—</span></p>
      <p><strong>Total de productos publicados:</strong> <span id="empresa-ventas">0</span></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC21V6Mkjy8l-XgplQiD6c0PAaOMTaGVu4",
      authDomain: "shop-87529.firebaseapp.com",
      databaseURL: "https://shop-87529-default-rtdb.firebaseio.com",
      projectId: "shop-87529"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    onAuthStateChanged(auth, async user => {
      if (!user) return alert("Debes iniciar sesión");

      const uid = user.uid;
      const empresaSnap = await get(child(ref(db), "empresas/" + uid));
      if (empresaSnap.exists()) {
        const data = empresaSnap.val();
        document.getElementById("empresa-nombre").textContent = data.nombre || "Sin nombre";
        document.getElementById("empresa-img").src = data.foto || "https://via.placeholder.com/120";
        document.getElementById("empresa-rfc").textContent = data.rfc || "—";
        document.getElementById("empresa-direccion").textContent = data.direccion || "—";
      }

      const productosSnap = await get(child(ref(db), "productos/" + uid));
      const total = productosSnap.exists() ? Object.keys(productosSnap.val()).length : 0;
      document.getElementById("empresa-ventas").textContent = total;
    });
  </script>
</body>
</html>
