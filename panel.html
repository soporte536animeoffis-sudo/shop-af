<!-- panel.html con ImgBB integrado -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Vendedores - Anime Offis</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; padding: 0; }
    header { background: #ff6600; color: white; padding: 1rem; text-align: center; }
    .container { max-width: 600px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #ff6600; color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
    .profile-preview { text-align: center; margin-bottom: 1rem; }
    .profile-preview img { width: 100px; border-radius: 50%; }
  </style>
</head>
<body>
  <header>
    <h1>Panel de Vendedores</h1>
    <p>Anime Offis MarketPlay</p>
  </header>

  <div class="container" id="auth-section">
    <h2>Acceso</h2>
    <input type="email" id="email" placeholder="Correo" />
    <input type="password" id="password" placeholder="Contraseña" />
    <input type="text" id="displayName" placeholder="Nombre de tienda (solo al registrarse)" />
    <input type="text" id="photoURL" placeholder="URL de imagen de perfil (opcional)" />
    <button id="login-btn">Iniciar sesión</button>
    <button id="register-btn">Crear cuenta</button>
  </div>

  <div class="container" id="panel-section" style="display:none;">
    <div class="profile-preview">
      <img id="profile-img" src="https://via.placeholder.com/100" alt="Perfil" />
      <p id="vendor-name">Tienda: —</p>
    </div>
    <input type="text" id="nombre" placeholder="Nombre del producto" />
    <textarea id="descripcion" placeholder="Descripción del producto"></textarea>
    <input type="number" id="precio" placeholder="Precio en MXN" />
    <input type="file" id="imagen" accept="image/*" />
    <button id="publicar-btn">Publicar producto</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC21V6Mkjy8l-XgplQiD6c0PAaOMTaGVu4",
      authDomain: "shop-87529.firebaseapp.com",
      databaseURL: "https://shop-87529-default-rtdb.firebaseio.com",
      projectId: "shop-87529"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const imgbbKey = "5b0931fc3792f2069b046ef7eed268da";

    document.getElementById("login-btn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, password)
        .then(() => alert("Sesión iniciada"))
        .catch(err => alert("Error: " + err.message));
    });

    document.getElementById("register-btn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const displayName = document.getElementById("displayName").value;
      const photoURL = document.getElementById("photoURL").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(userCredential => {
          updateProfile(userCredential.user, { displayName, photoURL });
          set(ref(db, "empresas/" + userCredential.user.uid), {
            nombre: displayName,
            foto: photoURL,
            rfc: "—",
            direccion: "—"
          });
          alert("Cuenta creada");
        })
        .catch(err => alert("Error: " + err.message));
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById("auth-section").style.display = "none";
        document.getElementById("panel-section").style.display = "block";
        document.getElementById("vendor-name").textContent = "Tienda: " + (user.displayName || user.email);
        document.getElementById("profile-img").src = user.photoURL || "https://via.placeholder.com/100";
      }
    });

    document.getElementById("publicar-btn").addEventListener("click", async () => {
      const nombre = document.getElementById("nombre").value;
      const descripcion = document.getElementById("descripcion").value;
      const precio = document.getElementById("precio").value;
      const imagenInput = document.getElementById("imagen");
      const vendedor = auth.currentUser;

      if (!vendedor) return alert("Debes iniciar sesión");
      if (!imagenInput.files[0]) return alert("Selecciona una imagen");

      const formData = new FormData();
      formData.append("image", imagenInput.files[0]);

      const upload = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, {
        method: "POST",
        body: formData
      });

      const result = await upload.json();
      if (!result.success) return alert("Error al subir imagen");

      const imagenURL = result.data.url;

      const productoRef = ref(db, "productos/" + vendedor.uid);
      await push(productoRef, {
        nombre,
        descripcion,
        precio: Number(precio),
        imagen: imagenURL,
        fecha: new Date().toISOString()
      });

      alert("Producto publicado");
      document.getElementById("nombre").value = "";
      document.getElementById("descripcion").value = "";
      document.getElementById("precio").value = "";
      imagenInput.value = "";
    });
  </script>
</body>
</html>
